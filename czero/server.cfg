// Use this file to configure your DEDICATED server. 
// This config file is executed on server start.

// disable autoaim
sv_aim 0

// disable clients' ability to pause the server
pausable 0

// default server name. Change to "Bob's Server", etc.
hostname "Condition Zero"

// maximum client movement speed 
sv_maxspeed 320

// 20 minute timelimit
mp_timelimit 20

sv_cheats 0

// load ban files
exec listip.cfg
exec banned.cfg

// --- AI TEAMMATES MOD CONFIG ---
log on
mp_logdetail 3
mp_logecho 1
mp_logfile 1
logaddress_delall
logaddress_add 127.0.0.1 27115
bot_chatter "off"
bot_defer_to_human 1
bot_auto_vacate 1
allow_spectators 1
sv_voiceenable 1
sv_voicecodec "voice_speex"
sv_voicequality 5
sv_alltalk 1
pausable 1
exec vpn_net.cfg
exec multiplayer_secret.cfg
// --- END AI TEAMMATES MOD CONFIG ---
